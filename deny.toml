# Dependency policy for the complete all-feature Linux production graph.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace packages deliberately use the repository's all-rights-reserved license.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "simplest-path"
deny = [
    { crate = "native-tls", reason = "Remote transports use rustls and must not regain an ambient platform-TLS dependency." },
    { crate = "openssl", reason = "Remote transports use rustls; OpenSSL adds an unnecessary native supply-chain boundary." },
    { crate = "openssl-sys", reason = "Remote transports use rustls; OpenSSL adds an unnecessary native supply-chain boundary." },
]
skip = [
    { crate = "block-buffer@0.10.4", reason = "Argon2 remains on the RustCrypto digest 0.10 generation." },
    { crate = "chacha20@0.9.1", reason = "chacha20poly1305 0.10 remains on the RustCrypto cipher 0.4 generation." },
    { crate = "cpufeatures@0.2.17", reason = "The older RustCrypto generation is still required by Argon2 and chacha20poly1305." },
    { crate = "crypto-common@0.1.7", reason = "Argon2 and chacha20poly1305 remain on the RustCrypto 0.1 generation." },
    { crate = "darling@0.20.11", reason = "Pinned croner 3 uses the prior derive_builder proc-macro lineage while Ratatui uses the current instability macros." },
    { crate = "darling_core@0.20.11", reason = "Pinned croner 3 uses the prior derive_builder proc-macro lineage while Ratatui uses the current instability macros." },
    { crate = "darling_macro@0.20.11", reason = "Pinned croner 3 uses the prior derive_builder proc-macro lineage while Ratatui uses the current instability macros." },
    { crate = "digest@0.10.7", reason = "Argon2 remains on digest 0.10 while current hashing uses digest 0.11." },
    { crate = "getrandom@0.2.17", reason = "Argon2's rand_core 0.6 lineage still requires getrandom 0.2." },
    { crate = "getrandom@0.3.4", reason = "The property-test dependency graph still requires getrandom 0.3." },
    { crate = "hashbrown@0.16.1", reason = "Ratatui's pinned layout solver uses hashbrown 0.16 while current workspace caches use 0.17." },
    { crate = "rand@0.9.4", reason = "OpenTelemetry SDK 0.32 and proptest remain on rand 0.9 while tungstenite 0.30 uses rand 0.10." },
    { crate = "rand_core@0.6.4", reason = "Argon2 remains on rand_core 0.6." },
    { crate = "rand_core@0.9.5", reason = "OpenTelemetry SDK 0.32 and proptest remain on rand 0.9 while tungstenite 0.30 and getrandom 0.4 use rand 0.10." },
    { crate = "strum@0.27.2", reason = "Pinned croner 3 uses strum 0.27 while Ratatui's split widget crates use 0.28." },
    { crate = "strum_macros@0.27.2", reason = "Pinned croner 3 uses strum 0.27 while Ratatui's split widget crates use 0.28." },
    { crate = "tower-http@0.6.11", reason = "reqwest 0.13 internally uses tower-http 0.6 while the API uses 0.7." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
